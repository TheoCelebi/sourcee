name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sourcee
          POSTGRES_PASSWORD: sourcee
          POSTGRES_DB: sourcee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sourcee -d sourcee_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Active les tests d'intégration (worker et API) sur la base du service ci-dessus.
      DATABASE_URL_TEST: postgres://sourcee:sourcee@localhost:5432/sourcee_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
