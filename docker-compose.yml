name: sourcee

# Base de développement locale uniquement (accessible depuis cette machine seulement).
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sourcee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcee}
      POSTGRES_DB: ${POSTGRES_DB:-sourcee}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
